<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Krishna Apps And Tools</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="index.html">📱 Krishna Apps And Tools</a>
    <div class="nav-links"><a href="register.html">Register</a></div>
  </nav>
  <div class="form-card">
    <h2>Login</h2>
    <div id="msg"></div>
    <input type="email" id="email" placeholder="Email"/>
    <input type="password" id="pass" placeholder="Password"/>
    <button class="btn" onclick="doLogin()">Login</button>
    <p style="text-align:center;margin-top:14px;font-size:0.85rem;color:#888">
      No account? <a href="register.html" style="color:#6c63ff">Register</a>
    </p>
  </div>
  <script src="store.js"></script>
  <script>
    if (getSession()) location.href = 'index.html';
    function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pass').value;
      const res = login(email, pass);
      if (res.error) {
        document.getElementById('msg').innerHTML = `<div class="msg error">${esc(res.error)}</div>`;
      } else {
        location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
